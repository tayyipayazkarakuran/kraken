[package]
name = "kraken-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kraken"
path = "src/main.rs"

[dependencies]
kraken-proto.workspace = true
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
parking_lot.workspace = true
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
egui-phosphor = { version = "0.14", features = ["regular", "fill", "bold"] }
rust-i18n = "4"
toml = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode", "std"] }

[dependencies.windows-sys]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true
